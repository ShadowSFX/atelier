appId: com.shadowsfx.atelier
productName: Atelier
copyright: Copyright © 2026 ShadowSFX
directories:
  output: release
  buildResources: resources

files:
  - out/**
  - resources/icon.png
  - package.json
  # node-pty sources are only needed to compile it.
  - '!node_modules/node-pty/{src,deps,third_party,scripts,typings}/**'
  - '!node_modules/**/*.{md,map,ts}'
  - '!node_modules/**/{test,tests,__tests__,docs,example,examples}/**'

# Native pieces must live outside the asar archive (they are executed or loaded from disk).
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/koffi/**

# node-pty ships N-API prebuilds (Windows) or is built against Node headers on install (Linux); koffi bundles its
# binaries. N-API modules load in Electron as they are, so nothing is rebuilt for Electron's ABI.
npmRebuild: false

electronFuses:
  # The Claude Code hooks and MCP server run with Atelier's own executable as node (ELECTRON_RUN_AS_NODE=1).
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false

win:
  # A single portable Atelier.exe: no installer, data in an "Atelier.data" folder next to it, self-updates from GitHub
  # Releases (src/main/portableUpdater.ts). The fixed name is what the updater looks for in a release.
  # The NSIS setup (+ latest.yml) is only the way out for copies installed by Atelier 0.1.0: their electron-updater
  # installs it, and the installed version then replaces itself with the portable exe (NSIS_UNINSTALLER in
  # src/shared/portable.ts). Keep its settings as they were in 0.1.0 so it updates that install in place.
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico

portable:
  # Each launch must unpack into its own temp folder: the stub empties that folder before unpacking and after the
  # app exits, so a shared one lets a second launch (which then quits on the single-instance lock) delete the
  # running copy's icudtl.dat & co. — and every ELECTRON_RUN_AS_NODE child (Claude hooks, MCP server) then dies
  # with "Invalid file descriptor to ICU data". Left out (or `false`, despite the docs), electron-builder 26 uses one
  # fixed name per build; only `true` skips it and unpacks into NSIS's per-launch $PLUGINSDIR.
  unpackDirName: true
  requestExecutionLevel: user
  artifactName: Atelier.exe

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  shortcutName: Atelier
  artifactName: Atelier-Setup-${version}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png
  maintainer: ShadowSFX
  synopsis: Project-based terminal workspace
  artifactName: Atelier-${version}-${arch}.${ext}

deb:
  depends: [libnss3, libgtk-3-0, libxss1, libasound2t64 | libasound2]

publish:
  provider: github
  owner: ShadowSFX
  repo: atelier
  releaseType: release
