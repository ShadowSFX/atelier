appId: com.shadowsfx.atelier
productName: Atelier
copyright: Copyright © 2026 ShadowSFX
directories:
  output: release
  buildResources: resources

files:
  - out/**
  - resources/icon.png
  - package.json
  # node-pty sources are only needed to compile it.
  - '!node_modules/node-pty/{src,deps,third_party,scripts,typings}/**'
  - '!node_modules/**/*.{md,map,ts}'
  - '!node_modules/**/{test,tests,__tests__,docs,example,examples}/**'

# Native pieces must live outside the asar archive (they are executed or loaded from disk).
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/koffi/**

# node-pty ships N-API prebuilds (Windows) or is built against Node headers on install (Linux); koffi bundles its
# binaries. N-API modules load in Electron as they are, so nothing is rebuilt for Electron's ABI.
npmRebuild: false

electronFuses:
  # The Claude Code hooks and MCP server run with Atelier's own executable as node (ELECTRON_RUN_AS_NODE=1).
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false

win:
  # A single portable Atelier.exe: no installer, data in an "Atelier.data" folder next to it, self-updates from GitHub
  # Releases (src/main/portableUpdater.ts). The fixed name is what the updater looks for in a release.
  target:
    - target: portable
      arch: [x64]
  icon: resources/icon.ico
  artifactName: Atelier.exe

portable:
  # No unpackDirName: each launch unpacks into its own temp folder, so a second launch never wipes a running copy.
  requestExecutionLevel: user

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png
  maintainer: ShadowSFX
  synopsis: Project-based terminal workspace
  artifactName: Atelier-${version}-${arch}.${ext}

deb:
  depends: [libnss3, libgtk-3-0, libxss1, libasound2t64 | libasound2]

publish:
  provider: github
  owner: ShadowSFX
  repo: atelier
  releaseType: release
