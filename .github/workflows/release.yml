name: Release

# Push a tag like v1.2.3: builds the portable Windows Atelier.exe (+ Atelier.exe.sha256, which its self-updater
# verifies), the NSIS setup + latest.yml (only so copies installed by 0.1.0 can move to the portable exe) and the
# Linux AppImage/.deb (+ latest-linux.yml for electron-updater) and publishes them as a GitHub Release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Version from tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be vMAJOR.MINOR.PATCH (got $GITHUB_REF_NAME)"; exit 1; }
          npm version "$v" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --publish always

      # The portable exe's self-updater (src/main/portableUpdater.ts) only installs a release that has this file.
      - name: Checksum for the Windows updater
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $hash = (Get-FileHash release/Atelier.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Atelier.exe" | Out-File -FilePath release/Atelier.exe.sha256 -Encoding ascii -NoNewline
          gh release upload "$env:GITHUB_REF_NAME" release/Atelier.exe.sha256 --clobber
